# =============================================================
# Staging Workflow — Test + Deploy ke Render Staging
# =============================================================
# Trigger: push ke branch 'develop'
# Tujuan: auto-deploy ke staging environment setelah test pass
#
# GitHub Secrets yang dibutuhkan:
#   RENDER_STAGING_DEPLOY_HOOK_URL — dari Render Dashboard:
#   Service → Settings → Deploy Hook → copy URL-nya
# =============================================================

name: Staging — Test & Deploy

on:
  push:
    branches:
      - develop

jobs:
  # ----------------------------------------
  # Job 1: Run Tests
  # ----------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-reports-${{ github.run_number }}
          path: build/reports/tests/
          retention-days: 7

  # ----------------------------------------
  # Job 2: Deploy ke Render Staging
  # ----------------------------------------
  deploy-staging:
    name: Deploy to Render Staging
    runs-on: ubuntu-latest
    needs: test  # Hanya deploy jika test pass

    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL }}

    steps:
      - name: Trigger Render Staging Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering Render staging deployment..."
          
          # Validasi: cek apakah secret sudah di-set
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "❌ ERROR: Secret RENDER_STAGING_DEPLOY_HOOK_URL belum di-set!"
            echo ""
            echo "Cara setup:"
            echo "  1. Buka Render Dashboard → Staging Service → Settings → Deploy Hook"
            echo "  2. Copy URL-nya"
            echo "  3. GitHub Repo → Settings → Secrets → Actions → New secret"
            echo "  4. Name: RENDER_STAGING_DEPLOY_HOOK_URL | Value: (paste URL)"
            exit 1
          fi
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "$DEPLOY_HOOK_URL")
          
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
            echo "✅ Render staging deploy triggered successfully (HTTP $RESPONSE)"
          else
            echo "❌ Failed to trigger deploy (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment triggered for commit ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Triggered by: ${{ github.actor }}"
          else
            echo "❌ Staging deployment failed"
          fi
