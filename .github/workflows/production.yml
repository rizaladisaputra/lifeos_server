# =============================================================
# Production Workflow — Test + Deploy ke Render Production
# =============================================================
# Trigger: push ke branch 'main'
# Tujuan: deploy ke production setelah semua test pass
#         (idealnya via PR merge dari develop ke main)
#
# GitHub Secrets yang dibutuhkan:
#   RENDER_PROD_DEPLOY_HOOK_URL — dari Render Dashboard:
#   Service → Settings → Deploy Hook → copy URL-nya
#
# GitHub Environments:
#   Tambah environment "production" di repo Settings → Environments
#   Aktifkan "Required reviewers" untuk approval manual sebelum deploy
# =============================================================

name: Production — Test & Deploy

on:
  push:
    branches:
      - main

jobs:
  # ----------------------------------------
  # Job 1: Run Tests
  # ----------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-test-reports-${{ github.run_number }}
          path: build/reports/tests/
          retention-days: 30

  # ----------------------------------------
  # Job 2: Deploy ke Render Production
  # ----------------------------------------
  deploy-production:
    name: Deploy to Render Production
    runs-on: ubuntu-latest
    needs: test  # Hanya deploy jika test pass

    environment:
      name: production
      url: ${{ vars.PROD_APP_URL }}

    steps:
      - name: Trigger Render Production Deploy
        run: |
          echo "🚀 Triggering Render production deployment..."
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}")
          
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
            echo "✅ Render production deploy triggered successfully (HTTP $RESPONSE)"
          else
            echo "❌ Failed to trigger production deploy (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Create deployment summary
        if: success()
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run** | [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
