spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  sql:
    init:
      mode: never

app:
  jwt:
    # Secret khusus untuk test — BUKAN untuk production
    secret: test-secret-for-unit-tests-only-do-not-use-in-production-abcdefgh-ijklmnop
    expiration-ms: 86400000
  firebase:
    config-path: classpath:serviceAccountKey.json

