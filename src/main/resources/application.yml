spring:
  application:
    name: lifeos_be
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lifeos}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # WAJIB di-set via environment variable. Tidak ada default untuk keamanan production.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:classpath:serviceAccountKey.json}
